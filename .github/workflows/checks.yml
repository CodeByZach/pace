name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - name: Check that generated files are up to date
        run: npm run build && git diff --exit-code

      - run: npm test

      - name: List package contents
        run: npm pack --dry-run
