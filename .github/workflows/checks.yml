name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - name: Check that generated files are up to date
        run: npm run build && git add --intent-to-add . && git diff --exit-code # also catches new files

      - run: npm run test:syntax

      - name: List package contents
        run: npm pack --dry-run

  # One job per engine, in parallel.
  browser-engines:
    name: browser-tests (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false # report every engine
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      # Not cached: Playwright's docs say restoring takes about as long as downloading.
      - name: Install the browser
        run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}

      - run: npm run test:browsers -- --project="${{ matrix.browser }} *"

  # The required check: passes only if every engine passed, so the required
  # checks stay the same when engines change.
  browser-tests:
    needs: browser-engines
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Check that every engine passed
        env:
          RESULT: ${{ needs.browser-engines.result }}
        run: test "$RESULT" = success
