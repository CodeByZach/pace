name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - name: Check that generated files are up to date
        run: npm run build && git add --intent-to-add . && git diff --exit-code # also catches new files

      - run: npm run test:syntax

      - name: List package contents
        run: npm pack --dry-run

  # One job per Playwright project (an engine and a pace file), in parallel.
  browser-projects:
    name: browser-tests (${{ matrix.browser }} ${{ matrix.file }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Playwright's image comes with its browsers and the system packages they need
    # (https://playwright.dev/docs/ci#via-containers), so nothing is installed here.
    # Its version must match @playwright/test in package.json, or the tests fail
    # to find their browsers. Pinned by digest, like the actions in actions.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    strategy:
      fail-fast: false # report every project
      matrix:
        # Every project in playwright.config.mjs; one missing here isn't tested in CI.
        include:
          - { browser: chromium, file: pace.js }
          - { browser: chromium, file: pace.min.js }
          - { browser: firefox, file: pace.min.js }
          - { browser: webkit, file: pace.min.js }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - run: npm run test:browsers -- --project="${{ matrix.browser }} ${{ matrix.file }}"

  # The required check: passes only if every project passed, so the required
  # checks stay the same when projects change.
  browser-tests:
    needs: browser-projects
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Check that every project passed
        env:
          RESULT: ${{ needs.browser-projects.result }}
        run: test "$RESULT" = success
